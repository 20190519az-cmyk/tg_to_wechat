name: 部署 Cloudflare Worker（每分钟转发）

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      KV_TITLE: tg2wecom-state
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::缺少仓库 Secret: CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "$WECOM_WEBHOOK" ] && { [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; }; then
            echo "::error::WECOM_WEBHOOK 和 FEISHU_APP_ID + FEISHU_APP_SECRET 至少要添加一组"; exit 1
          fi
          # 没填 CLOUDFLARE_ACCOUNT_ID 时用 API Token 自动查
          if [ -n "$ACCOUNT_ID_SECRET" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
          else
            ids=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[].id')
            if [ "$(echo "$ids" | grep -c .)" != "1" ]; then
              echo "::error::无法自动确定 Account ID（找到 $(echo "$ids" | grep -c .) 个账号），请添加 Secret: CLOUDFLARE_ACCOUNT_ID"
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ids" >> "$GITHUB_ENV"
            echo "自动获取 Account ID 成功"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: 准备 KV 存储
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          id=$(curl -fsS "${auth[@]}" "$api?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title==$t) | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" -X POST "$api" \
                 -d "{\"title\":\"$KV_TITLE\"}" | jq -r '.result.id')
            echo "已创建 KV: $id"
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::KV 创建失败，检查 API Token 权限"; exit 1; }
          sed -i "s/KV_NAMESPACE_ID/$id/" wrangler.toml

          # 从 GitHub Actions 版本的进度接着转发，避免切换时漏发或重发
          channel=$(sed -n 's/^TG_CHANNEL = "\(.*\)"/\1/p' wrangler.toml)
          last=$(jq -r --arg c "$channel" '.[$c] // empty' ../state.json 2>/dev/null || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/$id/values/$channel")
          if [ "$code" = "404" ] && [ -n "$last" ]; then
            curl -fsS "${auth[@]}" -X PUT "$api/$id/values/$channel" --data "$last" > /dev/null
            echo "已从 state.json 导入进度: #$last"
          fi

      - name: 准备 workers.dev 子域名（新账号设置定时任务需要）
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          sub=$(curl -sS "${auth[@]}" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            sub="tg2wecom-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            curl -fsS "${auth[@]}" -H "Content-Type: application/json" -X PUT "$api" \
                 -d "{\"subdomain\":\"$sub\"}" > /dev/null
            echo "已创建子域名: $sub.workers.dev"
          else
            echo "已有子域名: $sub.workers.dev"
          fi

      - name: 部署
        run: |
          secrets=$(mktemp)
          # RUN_KEY 由 API Token 派生，诊断工作流用同样方式算出来调用 /run
          run_key=$(printf '%s' "tg2wecom:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-40)
          # 没配置的推送渠道写成空字符串，相当于关闭（删除 Secret 后重新部署即可停用）
          jq -n --arg w "$WECOM_WEBHOOK" --arg fi "$FEISHU_APP_ID" --arg fa "$FEISHU_APP_SECRET" \
                --arg fc "$FEISHU_CHAT_ID" --arg k "$run_key" \
            '{WECOM_WEBHOOK: $w, FEISHU_APP_ID: $fi, FEISHU_APP_SECRET: $fa, FEISHU_CHAT_ID: $fc, RUN_KEY: $k}' > "$secrets"
          npx wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"

      - name: 清理已停用的 Secret
        run: |
          # ntfy 和飞书 webhook 方式已移除，删掉 Worker 上残留的配置（不存在时忽略）
          for name in NTFY_URL NTFY_TOKEN FEISHU_WEBHOOK FEISHU_SECRET; do
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tg2wecom/secrets/$name" || true
          done
