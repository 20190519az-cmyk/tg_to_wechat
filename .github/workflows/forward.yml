name: TG 频道转发到企业微信

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟（GitHub 高峰期可能延迟）
  workflow_dispatch:         # 允许在 Actions 页面手动运行

permissions:
  contents: write            # 需要把 state.json 提交回仓库

concurrency:
  group: tg2wecom
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并转发
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TG_CHANNEL: jdbroo
        run: python forward.py

      - name: 保存进度
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase
            git push
          fi
