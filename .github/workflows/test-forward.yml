name: 测试转发（重发最新一条）

# 把 Worker 的进度回退一条，Worker 下一分钟会把频道最新一条消息重新转发到群里
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 回退进度
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account="$ACCOUNT_ID_SECRET"
          [ -n "$account" ] || account=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          sub=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$account/workers/subdomain" | jq -r '.result.subdomain')
          run_key=$(printf '%s' "tg2wecom:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-40)
          curl -fsS -X POST -H "x-run-key: $run_key" "https://tg2wecom.$sub.workers.dev/rewind"
          echo "1 分钟内群里会收到最新一条"
