name: 诊断 Worker

# 查看 Worker 当前进度，并抓取约 2 分钟的实时运行日志
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: tg2wecom-state
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: 当前进度与定时任务
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          account="$ACCOUNT_ID_SECRET"
          [ -n "$account" ] || account=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          api="https://api.cloudflare.com/client/v4/accounts/$account"
          id=$(curl -fsS "${auth[@]}" "$api/storage/kv/namespaces?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title==$t) | .id' | head -n1)
          channel=$(sed -n 's/^TG_CHANNEL = "\(.*\)"/\1/p' wrangler.toml)
          echo "KV 进度: #$(curl -sS "${auth[@]}" "$api/storage/kv/namespaces/$id/values/$channel")"
          echo "定时任务:"
          curl -sS "${auth[@]}" "$api/workers/scripts/tg2wecom/schedules" | jq -c '.result'

      - name: 手动触发一次
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          sub=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          run_key=$(printf '%s' "tg2wecom:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-40)
          echo "调用 https://tg2wecom.$sub.workers.dev/run"
          for i in 1 2 3 4 5 6; do  # 新地址 DNS 可能要等一会儿
            code=$(curl -sS -o out.txt -w '%{http_code}' -X POST -H "x-run-key: $run_key" "https://tg2wecom.$sub.workers.dev/run" || true)
            [ "$code" != "000" ] && break
            sleep 15
          done
          echo "HTTP $code"; cat out.txt || true

      - name: 实时日志（约 130 秒）
        run: timeout 130 npx wrangler tail tg2wecom --format pretty || true
