name: 统计频道发帖量

on:
  workflow_dispatch:
    inputs:
      days:
        description: 统计最近几天
        default: "7"

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          channel=$(sed -n 's/^TG_CHANNEL = "\(.*\)"/\1/p' worker/wrangler.toml)
          python3 .github/scripts/channel_stats.py "$channel" "${{ inputs.days || '7' }}"
