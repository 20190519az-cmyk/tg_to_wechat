name = "tg2wecom"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true  # 提供受保护的手动触发地址 /run（诊断用）

[vars]
TG_CHANNEL = "jdbroo"

[triggers]
crons = ["* * * * *"]  # 每分钟

[[durable_objects.bindings]]
name = "STATE_DO"
class_name = "State"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["State"]

# 旧版进度存在 KV 里，保留绑定用于迁移
[[kv_namespaces]]
binding = "STATE"
id = "KV_NAMESPACE_ID"  # 部署时由 GitHub Actions 自动替换

[observability]
enabled = true  # 在 Cloudflare 控制台 → tg2wecom → Logs 查看每次运行的日志
