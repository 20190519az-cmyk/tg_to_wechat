name: TG 频道转发到企业微信（备用）

# 已改用 Cloudflare Worker 每分钟转发（见 worker/），这里的定时任务已停用。
# 只在 Worker 不可用时作为备用手动运行；不要和 Worker 同时开着，否则会重复转发。
on:
  workflow_dispatch:

permissions:
  contents: write            # 需要把 state.json 提交回仓库

concurrency:
  group: tg2wecom
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并转发
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TG_CHANNEL: jdbroo
        run: python forward.py

      - name: 保存进度
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase
            git push
          fi
